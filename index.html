<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vangelo Oggi</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    max-width:700px;
    margin:auto;
    padding:24px;
    line-height:1.8;
    background:#fafafa;
    color:#111;
    font-size:20px;
  }

  h1,h2,h3{
    line-height:1.3;
  }

  /* Nascondi elementi inutili */
  nav, aside, footer, iframe, script, style {
    display:none!important;
  }

  #content > * {
    display:block!important;
  }

  .loading{
    color:#777;
  }
</style>
</head>
<body>

<div id="content" class="loading">Caricamento articolo...</div>

<script>
async function loadArticle() {
  try {
    // Homepage del sito
    const homeUrl = "https://getupandwalk.gesuiti.it/";
    const proxy = "https://api.allorigins.win/raw?url=";

    // 1️⃣ Scarica homepage
    const homeHtml = await fetch(proxy + encodeURIComponent(homeUrl)).then(r => r.text());
    const parser = new DOMParser();
    const homeDoc = parser.parseFromString(homeHtml, "text/html");

   // 2️⃣ Trova il primo articolo del giorno
const firstArticle = homeDoc.querySelector("main article");
const firstLink = firstArticle ? firstArticle.querySelector("a") : null;

if(!firstLink){
  document.getElementById("content").innerHTML = "Articolo non trovato";
  return;
}
const articleUrl = firstLink.href;

    // 3️⃣ Scarica pagina completa dell’articolo
    const articleHtml = await fetch(proxy + encodeURIComponent(articleUrl)).then(r => r.text());
    const articleDoc = parser.parseFromString(articleHtml, "text/html");

    // 4️⃣ Estrai tutto il contenuto principale
    const contentDiv = articleDoc.querySelector(".entry-content");
    if(!contentDiv){
      document.getElementById("content").innerHTML = "Contenuto non trovato";
      return;
    }

    // 5️⃣ Rimuovi immagini e figure
    contentDiv.querySelectorAll("img, figure").forEach(e => e.remove());

    // 6️⃣ Inserisci il contenuto completo nella pagina
    document.getElementById("content").innerHTML = `<h1>${firstLink.textContent}</h1>` + contentDiv.innerHTML;

  } catch(err){
    console.error(err);
    document.getElementById("content").innerHTML = "Errore caricamento contenuto";
  }
}

loadArticle();
</script>

</body>
</html>
