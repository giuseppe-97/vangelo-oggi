<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vangelo Oggi</title>

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      max-width:700px;
      margin:auto;
      padding:24px;
      line-height:1.8;
      background:#fafafa;
      color:#111;
      font-size:20px;
    }

    h1,h2,h3{
      line-height:1.3;
    }

    img,
    nav,
    footer,
    aside,
    iframe{
      display:none!important;
    }

    a{
      color:#666;
      text-decoration:none;
    }

    .meta{
      color:#777;
      font-size:15px;
      margin-bottom:30px;
    }
  </style>
</head>

<body>
  <div id="content">
    Caricamento...
  </div>

<script>
async function loadArticle(){

  const proxy = "https://api.allorigins.win/raw?url=";
  const home = "https://getupandwalk.gesuiti.it/";

  const homeHtml = await fetch(proxy + encodeURIComponent(home))
    .then(r => r.text());

  const parser = new DOMParser();
  const homeDoc = parser.parseFromString(homeHtml, "text/html");

  const firstLink = homeDoc.querySelector("h2 a");

  if(!firstLink){
    document.getElementById("content").innerHTML =
      "Articolo non trovato";
    return;
  }

  const articleUrl = firstLink.href;

  const articleHtml = await fetch(proxy + encodeURIComponent(articleUrl))
    .then(r => r.text());

  const articleDoc = parser.parseFromString(articleHtml, "text/html");

  const article = articleDoc.querySelector("article");

  if(article){
    document.getElementById("content").innerHTML =
      article.innerHTML;
  } else {
    document.getElementById("content").innerHTML =
      "Contenuto non trovato";
  }
}

loadArticle();
</script>

</body>
</html>
