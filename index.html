<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vangelo" />
  <link rel="apple-touch-icon" href="minimal-cross.png" />
  <title>Vangelo del giorno</title>
  <style>
    /* ── Reset e variabili ── */
    :root {
      --bg: #faf8f4;
      --text: #1a1a1a;
      --accent: #7a5c3a;
      --muted: #888;
      --font: Georgia, 'Times New Roman', serif;
      --line: 1.85;
      --max: 680px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(17px, 4.5vw, 20px);
      line-height: var(--line);
      /* Rispetta le safe area di iPhone (notch, barra home) */
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px)
               env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2rem 1.2rem 4rem;
    }

    /* ── Stato di caricamento ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
      color: var(--muted);
      font-style: italic;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Contenuto articolo ── */
    #content { display: none; }

    .data {
      font-size: 0.78em;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: normal;
      color: var(--accent);
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .autore {
      font-size: 0.85em;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid #ddd;
    }

    /* ── Tipografia del corpo ── */
    #testo p {
      margin-bottom: 1.2em;
    }

    /* Titoletti interni (h2, h3, h4 presenti nel post) */
    #testo h2, #testo h3, #testo h4 {
      font-size: 1em;
      font-weight: bold;
      color: var(--accent);
      margin: 1.8em 0 0.4em;
      letter-spacing: 0.03em;
    }

    /* Versi e citazioni in corsivo */
    #testo em, #testo blockquote {
      font-style: italic;
      color: #444;
    }

    #testo blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1.2em 0;
    }

    /* Nascondi tutto il superfluo */
    #testo figure,
    #testo img,
    #testo .wp-caption,
    #testo .sharedaddy,
    #testo .share-this,
    #testo .jp-relatedposts,
    #testo .navigation,
    #testo [class*="share"],
    #testo [class*="social"],
    #testo [class*="related"],
    #testo [class*="advert"],
    #testo [class*="widget"] {
      display: none !important;
    }

    /* ── Errore ── */
    #errore {
      display: none;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
    #errore a { color: var(--accent); }
  </style>
</head>
<body>
<main>

  <div id="loading">
    <div class="spinner"></div>
    <span>Carico il vangelo di oggi…</span>
  </div>

  <div id="content">
    <p class="data" id="data-articolo"></p>
    <h1 id="titolo"></h1>
    <p class="autore" id="autore"></p>
    <div id="testo"></div>
  </div>

  <div id="errore">
    <p>Non riesco a caricare il testo.<br>
    Prova ad aprire direttamente il sito:<br>
    <a href="https://getupandwalk.gesuiti.it/" target="_blank">getupandwalk.gesuiti.it</a></p>
  </div>

</main>

<script>
// ─────────────────────────────────────────────
//  CONFIGURAZIONE
// ─────────────────────────────────────────────

// Proxy che aggira il CORS: allorigins (pubblico, zero config)
// Se usi il tuo Cloudflare Worker, sostituisci questa URL con la tua
// Il tuo proxy personale su Cloudflare Workers
const PROXY = url =>
  `https://dry-butterfly-0de6.giuseppemc.workers.dev/?url=${encodeURIComponent(url)}`;

const HOME   = 'https://getupandwalk.gesuiti.it/';
const FEED   = 'https://getupandwalk.gesuiti.it/feed/';

// ─────────────────────────────────────────────
//  UTILITÀ: formatta la data in italiano
// ─────────────────────────────────────────────
function dataItaliana(dateStr) {
  const mesi = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                'luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d = new Date(dateStr);
  return `${d.getDate()} ${mesi[d.getMonth()]} ${d.getFullYear()}`;
}

// ─────────────────────────────────────────────
//  Fetch generico tramite proxy — restituisce testo
// ─────────────────────────────────────────────
async function fetchViaProxy(url) {
  const risposta = await fetch(PROXY(url));
  if (!risposta.ok) throw new Error(`Errore HTTP: ${risposta.status}`);
  return await risposta.text(); // il nostro Worker restituisce testo diretto
}

// ─────────────────────────────────────────────
//  MAIN
// ─────────────────────────────────────────────
async function init() {
  try {
    // ── STEP 1: leggo il feed RSS e ricavo link + metadati del primo articolo ──
    const feedHtml = await fetchViaProxy(FEED);
    const parser   = new DOMParser();
    const xml      = parser.parseFromString(feedHtml, 'application/xml');
    const item     = xml.querySelector('item');

    if (!item) throw new Error('Nessun articolo nel feed');

    const link   = item.querySelector('link').textContent.trim();
    const titolo = item.querySelector('title').textContent.trim();
    const data   = item.querySelector('pubDate').textContent.trim();

    // ── STEP 2: carico la pagina dell'articolo ed estraggo il testo ──
    const paginaHtml = await fetchViaProxy(link);
    const doc        = parser.parseFromString(paginaHtml, 'text/html');

    // WordPress usa quasi sempre .entry-content; ho tre fallback per robustezza
    const corpo = doc.querySelector('.entry-content') ||
                  doc.querySelector('.post-content')  ||
                  doc.querySelector('article');

    if (!corpo) throw new Error('Corpo articolo non trovato nella pagina');

    // Rimuovo elementi grafici e social dal DOM estratto
    [
      'figure', 'img', '.sharedaddy', '.share-this',
      '.jp-relatedposts', '[class*="share"]', '[class*="social"]',
      '[class*="related"]', 'script', 'style', '.wp-caption'
    ].forEach(sel => corpo.querySelectorAll(sel).forEach(el => el.remove()));

    // Cerco il sottotitolo ("commento di Gv X, a cura di…")
    const h1  = doc.querySelector('h1.entry-title, h1');
    const sub = h1?.nextElementSibling;
    const autoreTestuale = (sub && sub.tagName !== 'DIV')
      ? sub.textContent.trim()
      : item.querySelector('creator')?.textContent?.trim() || '';

    // ── STEP 3: mostro tutto ──
    document.getElementById('data-articolo').textContent = dataItaliana(data);
    document.getElementById('titolo').textContent        = titolo;
    document.getElementById('autore').textContent        = autoreTestuale;
    document.getElementById('testo').innerHTML           = corpo.innerHTML;

    document.getElementById('loading').style.display    = 'none';
    document.getElementById('content').style.display    = 'block';

  } catch (err) {
    console.error('Errore:', err);
    document.getElementById('loading').style.display   = 'none';
    document.getElementById('errore').style.display    = 'block';
  }
}

init();
</script>
</body>
</html>
