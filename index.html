<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vangelo Oggi</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    max-width:700px;
    margin:auto;
    padding:24px;
    line-height:1.8;
    background:#fafafa;
    color:#111;
    font-size:20px;
  }

  h1,h2,h3{
    line-height:1.3;
  }

  /* Nascondi solo gli elementi non essenziali */
  nav, aside, footer, iframe, script, style {
    display:none!important;
  }

  /* Tutti i div e paragrafi dell’articolo devono essere visibili */
  #content > * {
    display:block!important;
  }

  .loading{
    color:#777;
  }
</style>
</head>
<body>

<div id="content" class="loading">Caricamento articolo...</div>

<script>
async function loadArticle() {
  try {
    // Prendiamo l'ultimo articolo dal sito
    const api = "https://getupandwalk.gesuiti.it/wp-json/wp/v2/posts?per_page=1";
    const response = await fetch(api);
    const posts = await response.json();
    const latest = posts[0];

    if(!latest){
      document.getElementById("content").innerHTML = "Nessun articolo trovato";
      return;
    }

    // Creiamo un contenitore temporaneo per modificare il contenuto
    const temp = document.createElement("div");
    temp.innerHTML = latest.content.rendered;

    // Rimuoviamo solo immagini e figure
    temp.querySelectorAll("img, figure").forEach(el => el.remove());

    // Pulizia di script o iframe residui
    temp.querySelectorAll("script, iframe, style").forEach(el => el.remove());

    // Inseriamo TUTTI i nodi figli nel contenitore principale
    const contentDiv = document.getElementById("content");
    contentDiv.innerHTML = `<h1>${latest.title.rendered}</h1>`;
    contentDiv.append(...temp.childNodes);

  } catch(err){
    console.error(err);
    document.getElementById("content").innerHTML = "Errore caricamento contenuto";
  }
}

loadArticle();
</script>

</body>
</html>
