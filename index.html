<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vangelo Oggi</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  max-width:700px;
  margin:auto;
  padding:24px;
  line-height:1.8;
  background:#fafafa;
  color:#111;
  font-size:20px;
}

img,
nav,
aside,
footer,
iframe{
  display:none!important;
}

h1,h2,h3{
  line-height:1.3;
}

.loading{
  color:#777;
}
</style>
</head>

<body>

<div id="content" class="loading">
Caricamento articolo...
</div>

<script>

async function loadArticle() {

  try {

    const rssUrl =
      "https://getupandwalk.gesuiti.it/feed/";

    const proxy =
      "https://api.rss2json.com/v1/api.json?rss_url=";

    const feedResponse =
      await fetch(proxy + encodeURIComponent(rssUrl));

    const feedData =
      await feedResponse.json();

    const latest =
      feedData.items[0];

    if(!latest){
      document.getElementById("content").innerHTML =
        "Nessun articolo trovato";
      return;
    }

    let html = latest.content;

    html = html.replace(/<img[^>]*>/gi, "");
    html = html.replace(/<figure[\s\S]*?<\/figure>/gi, "");

    document.getElementById("content").innerHTML = `
      <h1>${latest.title}</h1>
      ${html}
    `;

  } catch(err){

    document.getElementById("content").innerHTML =
      "Errore caricamento contenuto";

    console.error(err);
  }
}

loadArticle();

</script>

</body>
</html>
